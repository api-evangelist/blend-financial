aid: blend-financial
name: Blend Financial
description: >-
  Blend Financial Inc., doing business as Origin Financial (useorigin.com), is a
  consumer wealth management and personal finance platform that unifies income,
  net worth, spending, investments, assets, and liabilities into a single
  application. Origin pairs AI-powered budgeting and spend tracking with
  investment tools, estate and tax planning, and access to CFP professional
  advice; investment advisory services are provided through Origin Investment
  Advisory LLC, a subsidiary of Blend Financial Inc. The company is a consumer
  (B2C) product backed by 500 Global, Felicis Ventures, Founders Fund, and other
  investors, and also offers employer-sponsored financial wellness. As surfaced
  in the API Evangelist network it is a company profile; Origin publishes no
  public developer API, developer portal, or API documentation at this time.
